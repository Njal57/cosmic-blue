# On cosmic-blue the root filesystem is a read-only composefs overlay set up
# by ostree, and ostree-remount.service handles /sysroot and /var. Anaconda
# still writes a "/" line to /etc/fstab (btrfs subvol=root,compress=...,ro),
# which systemd-remount-fs then tries to apply to the overlay: the kernel
# refuses ("overlay: No changes allowed in reconfigure") and every system
# installed from the ISO boots "degraded". There is nothing for it to do on
# an ostree system, so it does not run there.
[Unit]
ConditionPathExists=!/run/ostree-booted
