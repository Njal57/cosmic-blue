# Systems installed from an image built before the rechunk label fix (Justfile
# ostree-rechunk, 2026-11-12) have a null "version" in /sysroot/.bootc-aleph.json.
# bootupctl refuses to parse it, so this service failed on every boot, and
# updates never rewrite that file. Repair it first.
[Service]
ExecStartPre=/usr/libexec/cosmic-blue-fix-aleph
