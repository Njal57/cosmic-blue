# Default settings for the Firefox flatpak, as Firefox enterprise policies
# (/usr/share/cosmic-blue/firefox/policies/policies.json): uBlock Origin
# installed (users can still turn it off), no telemetry or studies, no
# sponsored content or recommendations, Global Privacy Control on, no update
# checks (flatpak updates Firefox). Nothing is locked: users can change
# every setting.
#
# The Firefox flatpak mounts the org.mozilla.firefox.systemconfig extension
# directory at /app/etc/firefox and reads policies/policies.json from there.
# A symlink to /usr (instead of a copy in /var) keeps the defaults in step with
# the image on every update. "L+" also replaces the directory that Bluefin's
# setup hook used to copy there on older installs.
# Our policies.json replaces the one Mozilla's flatpak ships (Firefox reads
# only one), hence DisableAppUpdate.
d /var/lib/flatpak/extension/org.mozilla.firefox.systemconfig 0755 root root -
d /var/lib/flatpak/extension/org.mozilla.firefox.systemconfig/x86_64 0755 root root -
L+ /var/lib/flatpak/extension/org.mozilla.firefox.systemconfig/x86_64/stable - - - - /usr/share/cosmic-blue/firefox
