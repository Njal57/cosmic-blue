---
# Live ISO: boots into a COSMIC live session, from which the Anaconda installer
# installs the image embedded in the ISO (no download needed).
# Built with ublue-os/titanoboa, the same way projectbluefin/iso builds Bluefin's.
name: Build live ISO

on:
  # Started by promote-stable.yml each time `stable` moves (Tuesdays), so the
  # ISO always installs the current stable image; can also be run by hand.
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-live-iso.yml'
      - 'iso_files/**'

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  # Installed systems follow this tag. PR test builds use latest.
  DEFAULT_TAG: ${{ github.event_name == 'pull_request' && 'latest' || 'stable' }}
  # Same titanoboa revision as projectbluefin/iso
  TITANOBOA_REF: "840217d97bd0bc9a52466508c54d8dda5c5ba2fd"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build live ISO${{ matrix.image_suffix && format(' ({0})', matrix.image_suffix) || '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # One ISO per image: cosmic-blue, and cosmic-blue-nvidia for NVIDIA cards
        image_suffix: ["", "nvidia"]
    env:
      # output of build.yml, keep in sync
      IMAGE_NAME: ${{ github.event.repository.name }}${{ matrix.image_suffix && format('-{0}', matrix.image_suffix) || '' }}

    steps:
      # A new image has no ISO until build.yml has published it once
      - name: Check the image is published
        id: image
        run: |
          image_ref="${IMAGE_REGISTRY,,}/${IMAGE_NAME,,}:${DEFAULT_TAG}"
          if skopeo inspect --raw "docker://${image_ref}" >/dev/null; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::${image_ref} is not published yet, no ISO for it"
            echo "published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Maximize build space
        if: steps.image.outputs.published == 'true'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          extra-squeeze: "true"

      - name: Checkout
        if: steps.image.outputs.published == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Just
        if: steps.image.outputs.published == 'true'
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Build ISO
        if: steps.image.outputs.published == 'true'
        id: build
        env:
          HOOK_POST_ROOTFS: ${{ github.workspace }}/iso_files/configure_live_iso.sh
        run: |
          set -euo pipefail
          image_ref="${IMAGE_REGISTRY,,}/${IMAGE_NAME,,}:${DEFAULT_TAG}"
          titanoboa_dir="${RUNNER_TEMP}/titanoboa"
          git clone --quiet https://github.com/ublue-os/titanoboa "${titanoboa_dir}"
          git -C "${titanoboa_dir}" checkout --quiet "${TITANOBOA_REF}"
          # just >= 1.57 requires the list language feature used by which()
          sed -i '1a set lists' "${titanoboa_dir}/Justfile"
          # The post-rootfs hook only sees the titanoboa checkout (mounted at
          # /app), so ship the welcome tour files inside it.
          cp -r iso_files/welcome "${titanoboa_dir}/cosmic-blue-welcome"
          echo "${DEFAULT_TAG}" > "${titanoboa_dir}/cosmic-blue-image-tag"

          # Arguments: image, livesys, flatpaks file, compression, extra kargs,
          # image embedded for the installer, polkit rules.
          # No flatpaks in the ISO: the installed system gets them on first boot.
          sudo \
            env PATH="${PATH}" \
            CI="${CI}" \
            HOOK_post_rootfs="${HOOK_POST_ROOTFS}" \
            TITANOBOA_BUILDER_DISTRO=fedora \
            "$(command -v just)" -f "${titanoboa_dir}/Justfile" build \
            "${image_ref}" 1 NONE squashfs NONE "${image_ref}" 1
          sudo chown "$(id -u):$(id -g)" "${titanoboa_dir}/output.iso"

          # e.g. artifact cosmic-blue-live-amd64-iso holding cosmic-blue-live-amd64.iso
          name="${IMAGE_NAME,,}-live-amd64"
          mkdir -p output
          mv "${titanoboa_dir}/output.iso" "output/${name}.iso"
          echo "name=${name}" >> "${GITHUB_OUTPUT}"

      # Also uploaded on pull requests, so that the ISO can be tested before merging
      - name: Upload ISO to Job Artifacts
        if: steps.image.outputs.published == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.build.outputs.name }}-iso
          path: output/
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true

      # Public download for the website: the ISO and its checksum, under fixed
      # names so each build replaces the previous one (R2 free tier: 10 GB).
      # Skipped on pull requests and until the R2 secrets are set.
      - name: Upload ISO to Cloudflare R2
        if: steps.image.outputs.published == 'true' && github.event_name != 'pull_request'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          ISO_NAME: ${{ steps.build.outputs.name }}
        run: |
          set -euo pipefail
          if [[ -z "${AWS_ACCESS_KEY_ID}" || -z "${AWS_SECRET_ACCESS_KEY}" || -z "${R2_ACCOUNT_ID}" || -z "${R2_BUCKET}" ]]; then
            echo "::notice::R2 secrets or R2_BUCKET variable not set, skipping the public upload"
            exit 0
          fi
          cd output
          sha256sum "${ISO_NAME}.iso" > "${ISO_NAME}.iso.sha256"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # ISO first, then its checksum
          aws s3 cp --endpoint-url "${endpoint}" --no-progress \
            "${ISO_NAME}.iso" "s3://${R2_BUCKET}/${ISO_NAME}.iso"
          aws s3 cp --endpoint-url "${endpoint}" --no-progress \
            "${ISO_NAME}.iso.sha256" "s3://${R2_BUCKET}/${ISO_NAME}.iso.sha256"
