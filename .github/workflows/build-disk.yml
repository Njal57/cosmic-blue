---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      platform:
        required: true
        default: amd64
        type: choice
        options:
          - amd64
          - arm64
  pull_request:
    branches:
      - main
    paths:
      - 'disk_config/disk.toml'
      - 'disk_config/iso.toml'
      - '.github/workflows/build-disk.yml'

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build disk images
    # osbuild cannot mount its container storage on ubuntu-26.04 runners
    # ("mount: /run/osbuild/containers/storage: permission denied"); use 24.04.
    runs-on: ${{ inputs.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        disk-type: ["qcow2", "anaconda-iso"]
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Concatenate the types with a hyphen
          DISK_TYPE=$(echo "${{ matrix.disk-type }}" | tr ' ' '-')
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "DISK_TYPE=${DISK_TYPE}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Install dependencies
        if: inputs.platform == 'arm64'
        run: |
          set -x
          sudo apt update -y
          sudo apt install -y \
            podman

      - name: Maximize build space
        if: inputs.platform != 'arm64'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Add test account to the VM disk
        # The qcow2 is a ready-to-boot disk with no setup wizard, so it needs an
        # account. The password comes from the VM_TEST_PASSWORD repository
        # secret and is only stored hashed in the generated config.
        if: matrix.disk-type == 'qcow2'
        shell: bash
        env:
          VM_TEST_PASSWORD: ${{ secrets.VM_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${VM_TEST_PASSWORD}" ]]; then
            echo "::warning::VM_TEST_PASSWORD is not set: the qcow2 disk has no account"
            exit 0
          fi
          hash=$(printf '%s' "${VM_TEST_PASSWORD}" | openssl passwd -6 -stdin)
          cat >> ./disk_config/disk.toml <<TOML

          [[customizations.user]]
          name = "test"
          password = "${hash}"
          groups = ["wheel"]
          TOML

      - name: Build disk images
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ${{ matrix.disk-type == 'anaconda-iso' && './disk_config/iso.toml' || './disk_config/disk.toml' }}
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: ${{ matrix.disk-type }}
          # --rootfs: the image published before this change has no default root filesystem
          additional-args: --use-librepo=True --rootfs btrfs

      - name: Rename disk image
        id: rename
        if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
        shell: bash
        env:
          OUTPUT_DIR: ${{ steps.build.outputs.output-directory }}
          EXT: ${{ matrix.disk-type == 'anaconda-iso' && 'iso' || matrix.disk-type }}
          PLATFORM: ${{ inputs.platform || 'amd64' }}
        run: |
          set -euo pipefail
          src=$(find "$OUTPUT_DIR" -type f -name "*.${EXT}" | head -n 1)
          [[ -n "$src" ]] || { echo "No .${EXT} file in $OUTPUT_DIR" >&2; exit 1; }
          # e.g. cosmic-blue-amd64.iso / cosmic-blue-amd64.qcow2
          dest="${RUNNER_TEMP}/${IMAGE_NAME}-${PLATFORM}.${EXT}"
          mv "$src" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      - name: Upload disk image to Job Artifacts
        if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # e.g. artifact cosmic-blue-amd64-iso (zip) holding cosmic-blue-amd64.iso
          name: ${{ env.IMAGE_NAME }}-${{ inputs.platform || 'amd64' }}-${{ matrix.disk-type == 'anaconda-iso' && 'iso' || matrix.disk-type }}
          path: ${{ steps.rename.outputs.path }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 0
          overwrite: true

      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy $SOURCE_DIR S3:${{ secrets.S3_BUCKET_NAME }}
