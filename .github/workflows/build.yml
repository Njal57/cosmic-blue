---
name: Build container image
# Triggers, without duplicate builds:
#   - pull requests: build and boot-test, nothing is published,
#   - pushes to main (merged pull requests, Renovate base image updates): build
#     and publish,
#   - every day: build and publish to pick up Fedora package updates, unless
#     main was already built in the last hours (e.g. after the morning
#     Renovate base image update),
#   - by hand (workflow_dispatch), also used by check-cosmic-version.yml.
# Changes that do not end up in the image (website, docs, other workflows,
# Renovate config) do not start a build.
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
      - 'docs/**'
      - 'website/**'
      - 'artifacthub-repo.yml'
      - '.github/renovate.json5'
      - '.github/scripts/**'
      - '.github/workflows/build-live-iso.yml'
      - 'tests/vm-iso-install-test.sh'
      - '.github/workflows/check-cosmic-version.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/promote-stable.yml'
      - '.github/workflows/release-notes.yml'
      - '.github/workflows/test-update.yml'
      - 'tests/vm-update-test.sh'
  schedule:
    # Every day at 06:00 UTC (07:00 in Paris in winter, 08:00 in summer):
    # ublue-os/base-main is rebuilt around 01:10 and 04:10 UTC, this leaves
    # a margin for a late upstream build.
    - cron: '0 6 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
      - 'docs/**'
      - 'website/**'
      - 'artifacthub-repo.yml'
      - '.github/renovate.json5'
      - '.github/scripts/**'
      - '.github/workflows/build-live-iso.yml'
      - 'tests/vm-iso-install-test.sh'
      - '.github/workflows/check-cosmic-version.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/promote-stable.yml'
      - '.github/workflows/release-notes.yml'
      - '.github/workflows/test-update.yml'
      - 'tests/vm-update-test.sh'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  # The daily build is skipped if main was built within this many hours
  RECENT_BUILD_HOURS: 8

# Pull requests: a new push cancels the running build. Main: builds queue up
# instead, so a publishing build is never cut short.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  recent_build:
    name: Check for a recent build
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Look for a recent build of main
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          since="$(date -u -d "-${RECENT_BUILD_HOURS} hours" +%FT%TZ)"
          # Successful, running or queued builds of main, other than this run
          recent="$(gh run list --workflow build.yml --branch main --limit 30 \
            --json databaseId,status,conclusion,createdAt,event,url \
            --jq "map(select(.databaseId != ${GITHUB_RUN_ID} and .event != \"pull_request\"
                  and .createdAt >= \"${since}\"
                  and (.status != \"completed\" or .conclusion == \"success\")))
                  | .[0].url // empty")"
          if [ -n "${recent}" ]; then
            echo "main was built in the last ${RECENT_BUILD_HOURS} hours, skipping: ${recent}"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

  build_push:
    name: Build and push ${{ matrix.image_suffix && format('image ({0})', matrix.image_suffix) || 'image' }}
    needs: recent_build
    # recent_build only runs for the daily build
    if: >-
      !cancelled() &&
      (needs.recent_build.result == 'skipped' ||
       (needs.recent_build.result == 'success' && needs.recent_build.outputs.skip != 'true'))
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # cosmic-blue, and cosmic-blue-nvidia with the NVIDIA driver
        # (build_files/35-nvidia.sh)
        image_suffix: ["", "nvidia"]

    permissions:
      contents: read
      packages: write

    steps:
      # Action versions are pinned to commits and updated by Renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)
          if [[ -n "${{ matrix.image_suffix }}" ]]; then
            IMAGE_NAME="${IMAGE_NAME}-${{ matrix.image_suffix }}"
          fi

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)

          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # This actually builds the container image
      - name: Build Image
        id: build-image
        run: |
          just build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # Smaller delta updates for installed systems
      - name: Rechunk with rpm-ostree
        id: rechunk
        run: |
          just ostree-rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      # Boot smoke test: install the image to a virtual disk, boot it in QEMU
      # and check the login screen comes up. A failing image is not pushed.
      - name: Prepare the boot test
        uses: ./.github/actions/vm-test-setup

      - name: Copy the image for the boot test
        # bootc install runs from the root podman storage
        run: podman save "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" | sudo podman load

      - name: Boot test
        timeout-minutes: 40
        env:
          TARGET_IMGREF: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # The virtual machine has no NVIDIA GPU for these to work with
          EXTRA_IGNORED_UNITS: ${{ matrix.image_suffix == 'nvidia' && 'nvidia-persistenced|nvidia-cdi-refresh' || '' }}
        run: |
          tests/vm-boot-test.sh "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" "${RUNNER_TEMP}/boot-test"

      # Logs, screenshots and the screenshot sheet linked from the run summary
      - name: Publish the boot test results
        if: always()
        uses: ./.github/actions/vm-test-results
        with:
          dir: ${{ runner.temp }}/boot-test
          name: boot-test-${{ env.IMAGE_NAME }}
          title: ${{ env.IMAGE_NAME }}

      - name: Free the boot test space
        if: always()
        run: sudo podman rmi -f "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" || true

      # Only the default branch publishes: pull requests and other branches
      # (e.g. the COSMIC update branches) build and test the image only.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      # Installed systems only accept updates signed with the key matching
      # cosign.pub (/etc/containers/policy.json), so an unsigned image is an error.
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.4'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: "" # key generated without a password
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          if [[ -z "${COSIGN_PRIVATE_KEY}" ]]; then
            echo "::error::The SIGNING_SECRET secret is missing: installed systems would refuse this image"
            exit 1
          fi
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

