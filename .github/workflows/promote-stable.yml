---
# Promotes an already published image to the `stable` tag.
#
# Every image on GHCR has passed the CI boot test (build.yml does not push or
# sign an image that fails it). `latest` gets each daily build; `stable` moves
# once a week to the daily build from 7 days earlier, so every `stable` image
# has spent a week on `latest` first. If a regression shows up during that
# week, run this workflow by hand with a known good tag (e.g. 20261105) to
# point `stable` back to it, or disable the workflow to freeze `stable`.
#
# Before stable moves, an update test installs the current stable image in a
# virtual machine, updates it to the new one, reboots and checks it, then
# rolls back (tests/vm-update-test.sh, also runnable alone with
# test-update.yml). If it fails, stable stays where it is; the logs and
# screenshots are linked from the run summary.
#
# The tag is copied by digest, so the cosign signature made by build.yml stays
# valid: nothing is rebuilt or re-signed here.
#
# Each promotion then publishes release notes (release-notes.yml): a GitHub
# Release named after the dated stable tag, listing the package changes since
# the previous stable image.
# It also starts the live ISO build (build-live-iso.yml), which embeds `stable`.
name: Promote stable image

on:
  schedule:
    # Every Tuesday at 12:00 UTC, after the daily image build
    - cron: '0 12 * * 2'
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Tag to promote (e.g. latest or 20261105). Empty: the daily build from 7 days ago."
        required: false
        default: ""
      skip_update_test:
        description: "Promote without the update test (e.g. to roll stable back quickly)"
        type: boolean
        required: false
        default: false

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  SOAK_DAYS: 7

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote ${{ matrix.image_suffix && format('{0} ', matrix.image_suffix) || '' }}to stable
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # Same images as build.yml: cosmic-blue and cosmic-blue-nvidia
        image_suffix: ["", "nvidia"]
    env:
      # output of build.yml, keep in sync
      IMAGE_NAME: ${{ github.event.repository.name }}${{ matrix.image_suffix && format('-{0}', matrix.image_suffix) || '' }}
    permissions:
      contents: read
      packages: write
    # Written by the cosmic-blue instance only (the nvidia one writes none of
    # these, so they are not overwritten): release notes and the live ISO
    # follow the main image.
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}
      previous: ${{ steps.promote.outputs.previous }}
      digest: ${{ steps.promote.outputs.digest }}
      release_tag: ${{ steps.promote.outputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pick the image to promote
        id: pick
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="${IMAGE_REGISTRY,,}/${IMAGE_NAME,,}"
          creds="${GH_ACTOR}:${GH_TOKEN}"

          digest_of() {
            skopeo inspect --creds "${creds}" --format '{{.Digest}}' "docker://${image}:$1" 2>/dev/null
          }

          # Pick the source: the given tag, or the most recent daily build
          # that is at least SOAK_DAYS old (a day without a green build has
          # no date tag, so look back up to a week further).
          source=""
          if [[ -n "${SOURCE_TAG}" ]]; then
            digest_of "${SOURCE_TAG}" >/dev/null || { echo "::error::Tag ${SOURCE_TAG} not found"; exit 1; }
            source="${SOURCE_TAG}"
          else
            for days in $(seq "${SOAK_DAYS}" $((SOAK_DAYS + 7))); do
              tag="$(date -u -d "${days} days ago" +%Y%m%d)"
              if digest_of "${tag}" >/dev/null; then
                source="${tag}"
                break
              fi
            done
            [[ -n "${source}" ]] || { echo "::error::No daily build found between ${SOAK_DAYS} and $((SOAK_DAYS + 7)) days ago"; exit 1; }
          fi
          digest="$(digest_of "${source}")"
          echo "Source: ${image}:${source} (${digest})"

          # Only promote images signed by build.yml with our key
          cosign verify --key cosign.pub "${image}@${digest}" >/dev/null

          previous="$(digest_of stable || true)"
          {
            echo "image=${image}"
            echo "source=${source}"
            echo "digest=${digest}"
            echo "previous=${previous}"
          } >> "${GITHUB_OUTPUT}"

      # Install the current stable image in a virtual machine, update it to
      # the image about to be promoted, reboot and check it, then roll back
      # (tests/vm-update-test.sh): stable only moves if users can update to it.
      - name: Maximize build space
        if: steps.pick.outputs.previous != '' && steps.pick.outputs.previous != steps.pick.outputs.digest && !inputs.skip_update_test
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Prepare the update test
        if: steps.pick.outputs.previous != '' && steps.pick.outputs.previous != steps.pick.outputs.digest && !inputs.skip_update_test
        uses: ./.github/actions/vm-test-setup

      - name: Update test
        id: update-test
        if: steps.pick.outputs.previous != '' && steps.pick.outputs.previous != steps.pick.outputs.digest && !inputs.skip_update_test
        timeout-minutes: 90
        env:
          IMAGE: ${{ steps.pick.outputs.image }}
          DIGEST: ${{ steps.pick.outputs.digest }}
          # The virtual machine has no NVIDIA GPU for these to work with
          EXTRA_IGNORED_UNITS: ${{ matrix.image_suffix == 'nvidia' && 'nvidia-persistenced|nvidia-cdi-refresh' || '' }}
        run: |
          tests/vm-update-test.sh "${IMAGE}:stable" "${IMAGE}@${DIGEST}" "${RUNNER_TEMP}/update-test"

      - name: Publish the update test results
        if: always() && steps.update-test.outcome != 'skipped'
        uses: ./.github/actions/vm-test-results
        with:
          dir: ${{ runner.temp }}/update-test
          name: update-test-${{ env.IMAGE_NAME }}
          title: ${{ env.IMAGE_NAME }} stable → ${{ steps.pick.outputs.source }}

      - name: Promote
        id: promote
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ steps.pick.outputs.image }}
          source: ${{ steps.pick.outputs.source }}
          digest: ${{ steps.pick.outputs.digest }}
          previous: ${{ steps.pick.outputs.previous }}
        run: |
          set -euo pipefail
          outputs=/dev/null
          if [[ -z "${{ matrix.image_suffix }}" ]]; then outputs="${GITHUB_OUTPUT}"; fi
          creds="${GH_ACTOR}:${GH_TOKEN}"

          digest_of() {
            skopeo inspect --creds "${creds}" --format '{{.Digest}}' "docker://${image}:$1" 2>/dev/null
          }

          if [[ "${previous}" == "${digest}" ]]; then
            echo "stable already points to ${digest}, nothing to do"
            echo "promoted=false" >> "${outputs}"
            exit 0
          fi
          release_tag="stable-$(date -u +%Y%m%d)"

          # Copy by digest so the signature still applies; also keep a dated
          # stable tag to make rollbacks to an earlier stable easy.
          for tag in stable "${release_tag}"; do
            skopeo copy --all --preserve-digests \
              --src-creds "${creds}" --dest-creds "${creds}" \
              "docker://${image}@${digest}" "docker://${image}:${tag}"
          done

          [[ "$(digest_of stable)" == "${digest}" ]] || { echo "::error::stable digest mismatch after copy"; exit 1; }
          cosign verify --key cosign.pub "${image}:stable" >/dev/null

          {
            echo "promoted=true"
            echo "previous=${previous}"
            echo "digest=${digest}"
            echo "release_tag=${release_tag}"
          } >> "${outputs}"

          {
            echo "### stable promoted"
            echo
            echo "- Source: \`${image}:${source}\`"
            echo "- Digest: \`${digest}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  release-notes:
    name: Release notes
    needs: promote
    # Also when the nvidia promotion failed (e.g. no week-old build yet)
    if: ${{ !cancelled() && needs.promote.outputs.promoted == 'true' }}
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/release-notes.yml
    with:
      old: ${{ needs.promote.outputs.previous }}
      new: ${{ needs.promote.outputs.digest }}
      release_tag: ${{ needs.promote.outputs.release_tag }}

  live-iso:
    name: Start the live ISO build
    needs: promote
    if: ${{ !cancelled() && needs.promote.outputs.promoted == 'true' }}
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      - name: Dispatch build-live-iso.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run build-live-iso.yml --ref "${{ github.event.repository.default_branch }}"
