---
# Project website on GitHub Pages: https://cosmic-blue-os.github.io/cosmic-blue/
# Needs Settings > Pages > Source set to "GitHub Actions".
# Also rebuilt after each published image build, so the screenshots page
# shows the desktop of the latest image (website/fetch-screenshots.sh).
name: Website

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pages.yml'
      - 'website/**'
      - 'branding/logo/**'
      - 'system_files/usr/share/backgrounds/cosmic-blue/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pages.yml'
      - 'website/**'
  workflow_run:
    workflows:
      - Build container image
    types:
      - completed
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build website
    # After an image build: only a published one (main, not a pull request)
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read  # download the boot test screenshots
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install ImageMagick
        run: command -v convert || (sudo apt-get update && sudo apt-get install -y imagemagick)

      - name: Fetch the desktop screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: website/fetch-screenshots.sh "${RUNNER_TEMP}/screenshots"

      - name: Build
        env:
          SCREENSHOTS_DIR: ${{ runner.temp }}/screenshots
          # Public URL of the R2 bucket holding the live ISO (repository variable)
          ISO_BASE_URL: ${{ vars.ISO_BASE_URL }}
        run: website/build.sh _site

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy website
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
